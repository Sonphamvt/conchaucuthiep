<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sơ Đồ Gia Phả Vành Xuyến - Đồng Tâm</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- D3.js -->
    <script src="https://d3js.org/d3.v7.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=Playfair+Display:wght@600;700;800&family=Roboto:wght@300;400;500;700&display=swap');
        
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #fdfbf7;
            color: #2c2c2c;
        }
        
        .font-serif-title { font-family: 'Playfair Display', serif; }
        .font-serif-body { font-family: 'Merriweather', serif; }

        .bg-crimson { background-color: #8b0000; }
        .text-crimson { color: #8b0000; }
        .border-crimson { border-color: #8b0000; }
        .bg-amber-gold { background-color: #d4af37; }
        .text-amber-gold { color: #d4af37; }

        .sunburst-node {
            cursor: pointer;
            transition: opacity 0.2s, filter 0.2s;
            stroke: #ffffff;
            stroke-width: 1.5px;
        }
        .sunburst-node:hover {
            opacity: 0.85;
            filter: drop-shadow(0 0 6px rgba(212, 175, 55, 0.9));
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #8b0000; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-crimson text-white shadow-lg sticky top-0 z-30 border-b-2 border-amber-gold">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-wrap justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-amber-gold flex items-center justify-center text-crimson font-bold text-xl shadow">
                    <i class="fa-solid fa-tree"></i>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-serif-title font-bold tracking-wide uppercase text-amber-gold">
                        GIA PHẢ TỘC PHẠM HỮU (TỪ ĐỜI F7)
                    </h1>
                    <p class="text-xs text-amber-100 font-serif-body italic">Sơ đồ vành xuyến đồng tâm - Vợ chồng cùng hàng</p>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center space-x-2 mt-2 sm:mt-0">
                <button onclick="resetSunburstZoom()" class="bg-amber-gold hover:bg-amber-600 text-crimson font-bold px-3 py-1.5 rounded-md text-sm shadow flex items-center transition">
                    <i class="fa-solid fa-arrows-to-eye mr-1.5"></i>Đặt lại tâm (F7)
                </button>
                <button onclick="resetData()" title="Tải lại dữ liệu từ Google Sheets" class="bg-red-900 hover:bg-red-950 text-white p-1.5 rounded-md text-sm transition">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-7xl w-full mx-auto p-4 sm:p-6">
        <section class="space-y-4">
            <div class="bg-amber-50 border border-amber-200 rounded-lg p-3 flex flex-wrap justify-between items-center text-sm text-amber-900">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-circle-info text-amber-700"></i>
                    <span>Tâm hình tròn đại diện cho <b>Đời thứ F7</b>. Vợ & Chồng cùng nằm trên 1 ô vành xuyến. Nhấp chuột vào từng ô để thu/phóng nhánh.</span>
                </div>

                <div class="flex items-center space-x-4 text-xs mt-2 sm:mt-0">
                    <span class="flex items-center"><span class="w-3 h-3 rounded-full bg-[#8b0000] inline-block mr-1"></span> Đời F7 (Tâm)</span>
                    <span class="flex items-center"><span class="w-3 h-3 rounded-full bg-[#1e40af] inline-block mr-1"></span> Đời F8</span>
                    <span class="flex items-center"><span class="w-3 h-3 rounded-full bg-[#047857] inline-block mr-1"></span> Đời F9</span>
                    <span class="flex items-center"><span class="w-3 h-3 rounded-full bg-[#b45309] inline-block mr-1"></span> Đời F10+</span>
                </div>
            </div>

            <!-- Sunburst Container -->
            <div class="bg-white border border-stone-200 rounded-xl shadow-inner relative overflow-hidden h-[700px] flex items-center justify-center" id="sunburst-container">
                <svg id="sunburst-svg" class="w-full h-full cursor-grab active:cursor-grabbing"></svg>
            </div>
        </section>
    </main>

    <!-- DRAWER: XEM CHI TIẾT THÀNH VIÊN -->
    <div id="detail-drawer" class="fixed inset-y-0 right-0 w-full sm:w-[420px] bg-white shadow-2xl z-50 transform translate-x-full transition-transform duration-300 ease-in-out border-l border-stone-200 flex flex-col">
        <div class="bg-crimson text-white p-4 flex justify-between items-center border-b border-amber-gold">
            <h3 class="font-serif-title font-bold text-lg">Thông Tin Cặp Vợ Chồng / Thành Viên</h3>
            <button onclick="closeDrawer()" class="text-white hover:text-amber-gold text-xl"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="drawer-content" class="p-6 overflow-y-auto flex-grow space-y-4"></div>
    </div>

    <script>
        let rawMembers = [];
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxIsTDSjmJTY7JLDQqfZJJuMy0m0APuihQrmcshbJitLXywf9B-9_ymSnr_xGsGbVx5/exec";

        window.addEventListener('DOMContentLoaded', () => {
            fetch(WEB_APP_URL)
                .then(response => response.json())
                .then(data => {
                    console.log("Đã tải dữ liệu thành công:", data);
                    rawMembers = data;
                    renderSunburstChart();
                })
                .catch(error => {
                    console.error("Lỗi khi tải dữ liệu:", error);
                    alert("Không thể tải dữ liệu từ Google Sheets!");
                });
        });

        function resetData() {
            location.reload();
        }

        function closeDrawer() {
            document.getElementById('detail-drawer').classList.add('translate-x-full');
        }

        const genColors = {
            7: "#8b0000",
            8: "#1e40af",
            9: "#047857",
            10: "#b45309",
            11: "#6b21a8"
        };

        function getSpouseNames(member) {
            if (!member.spouseIds) return "";
            
            let spouseList = [];
            let rawSpouse = member.spouseIds;

            if (Array.isArray(rawSpouse)) {
                spouseList = rawSpouse;
            } else if (typeof rawSpouse === 'string') {
                let cleaned = rawSpouse.trim();
                if (cleaned.startsWith('[') && cleaned.endsWith(']')) {
                    cleaned = cleaned.substring(1, cleaned.length - 1);
                }
                spouseList = cleaned.split(',').map(s => s.trim().replace(/['"]/g, '')).filter(Boolean);
            }

            if (spouseList.length === 0) return "";

            let spouses = spouseList.map(id => rawMembers.find(m => m && String(m.id).trim() === String(id).trim())).filter(Boolean);
            return spouses.map(s => s.name).join(", ");
        }

        function renderSunburstChart() {
            const container = document.getElementById('sunburst-container');
            const svg = d3.select("#sunburst-svg");
            svg.selectAll("*").remove();

            const width = container.clientWidth;
            const height = container.clientHeight;
            const radius = Math.min(width, height) / 2 - 20;

            let f7AndLater = rawMembers.filter(m => m.generation >= 7);
            let rootF7List = f7AndLater.filter(m => m.generation === 7);

            if (rootF7List.length === 0) {
                let minGen = d3.min(f7AndLater, m => m.generation) || 7;
                rootF7List = f7AndLater.filter(m => m.generation === minGen);
            }

            function createCoupleNode(member) {
                let spouseNames = getSpouseNames(member);
                let displayName = member.name;
                if (spouseNames) {
                    displayName += " & " + spouseNames;
                }
                return {
                    id: member.id,
                    name: displayName,
                    primaryMember: member,
                    generation: member.generation,
                    children: []
                };
            }

            let addedIds = new Set();

            function buildSunburstBranch(memberId) {
                let m = rawMembers.find(item => item && String(item.id).trim() === String(memberId).trim());
                if (!m || addedIds.has(m.id)) return null;
                addedIds.add(m.id);

                let node = createCoupleNode(m);
                let childrenMembers = rawMembers.filter(item => (String(item.fatherId).trim() === String(memberId).trim() || String(item.motherId).trim() === String(memberId).trim()));

                let rawSpouse = m.spouseIds;
                let spouseList = [];
                if (Array.isArray(rawSpouse)) spouseList = rawSpouse;
                else if (typeof rawSpouse === 'string') {
                    let cleaned = rawSpouse.trim();
                    if (cleaned.startsWith('[') && cleaned.endsWith(']')) cleaned = cleaned.substring(1, cleaned.length - 1);
                    spouseList = cleaned.split(',').map(s => s.trim().replace(/['"]/g, '')).filter(Boolean);
                }

                spouseList.forEach(sId => addedIds.add(String(sId).trim()));

                childrenMembers.forEach(c => {
                    let childBranch = buildSunburstBranch(c.id);
                    if (childBranch) {
                        node.children.push(childBranch);
                    }
                });

                return node;
            }

            let rootHierarchyData = {
                id: "root-center",
                name: "ĐỜI F7 (TRUNG TÂM)",
                generation: 7,
                children: []
            };

            rootF7List.forEach(f7Member => {
                if (!addedIds.has(f7Member.id)) {
                    let branch = buildSunburstBranch(f7Member.id);
                    if (branch) rootHierarchyData.children.push(branch);
                }
            });

            let hierarchyInput = rootHierarchyData.children.length === 1 ? rootHierarchyData.children[0] : rootHierarchyData;

            const hierarchy = d3.hierarchy(hierarchyInput)
                .sum(d => d.children && d.children.length > 0 ? 0 : 1)
                .sort((a, b) => b.value - a.value);

            const partition = d3.partition()
                .size([2 * Math.PI, radius]);

            const rootNode = partition(hierarchy);
            rootNode.each(d => d.current = d);

            const arc = d3.arc()
                .startAngle(d => d.x0)
                .endAngle(d => d.x1)
                .padAngle(d => Math.min((d.x1 - d.x0) / 2, 0.005))
                .padRadius(radius / 2)
                .innerRadius(d => d.y0)
                .outerRadius(d => Math.max(d.y0, d.y1 - 1));

            const g = svg.append("g")
                .attr("transform", `translate(${width / 2},${height / 2})`);

            const zoom = d3.zoom()
                .scaleExtent([0.5, 5])
                .on("zoom", (event) => {
                    g.attr("transform", event.transform);
                });
            svg.call(zoom);
            svg.call(zoom.transform, d3.zoomIdentity.translate(width / 2, height / 2));

            const path = g.append("g")
                .selectAll("path")
                .data(rootNode.descendants())
                .join("path")
                .attr("fill", d => {
                    let gen = d.data.generation || 7;
                    return genColors[gen] || "#d4af37";
                })
                .attr("fill-opacity", d => arcVisible(d.current) ? (d.children ? 0.9 : 0.75) : 0)
                .attr("pointer-events", d => arcVisible(d.current) ? "auto" : "none")
                .attr("d", d => arc(d.current))
                .attr("class", "sunburst-node")
                .on("click", (event, d) => {
                    if (d.children && d.children.length > 0) {
                        clicked(event, d);
                    } else {
                        showDetail(d.data.id);
                    }
                });

            path.append("title")
                .text(d => `${d.data.name}\nĐời F${d.data.generation || 7}`);

            const label = g.append("g")
                .attr("pointer-events", "none")
                .attr("text-anchor", "middle")
                .style("user-select", "none")
                .selectAll("text")
                .data(rootNode.descendants())
                .join("text")
                .attr("fill-opacity", d => +labelVisible(d.current))
                .attr("transform", d => labelTransform(d.current))
                .attr("fill", "#ffffff")
                .attr("font-size", d => d.depth === 0 ? "13px" : "10px")
                .attr("font-weight", "bold")
                .text(d => d.data.name);

            const parentCircle = g.append("circle")
                .datum(rootNode)
                .attr("r", rootNode.y1)
                .attr("fill", "none")
                .attr("pointer-events", "all")
                .on("click", clicked);

            function clicked(event, p) {
                parentCircle.datum(p.parent || rootNode);

                rootNode.each(d => d.target = {
                    x0: Math.max(0, Math.min(1, (d.x0 - p.x0) / (p.x1 - p.x0))) * 2 * Math.PI,
                    x1: Math.max(0, Math.min(1, (d.x1 - p.x0) / (p.x1 - p.x0))) * 2 * Math.PI,
                    y0: Math.max(0, d.y0 - p.depth),
                    y1: Math.max(0, d.y1 - p.depth)
                });

                const t = g.transition().duration(750);

                path.transition(t)
                    .tween("data", d => {
                        const i = d3.interpolate(d.current, d.target);
                        return t => d.current = i(t);
                    })
                    .filter(function(d) {
                        return +this.getAttribute("fill-opacity") || arcVisible(d.target);
                    })
                    .attr("fill-opacity", d => arcVisible(d.target) ? (d.children ? 0.9 : 0.75) : 0)
                    .attr("pointer-events", d => arcVisible(d.target) ? "auto" : "none")
                    .attrTween("d", d => () => arc(d.current));

                label.filter(function(d) {
                    return +this.getAttribute("fill-opacity") || labelVisible(d.target);
                }).transition(t)
                    .attr("fill-opacity", d => +labelVisible(d.target))
                    .attrTween("transform", d => () => labelTransform(d.current));
            }

            function arcVisible(d) {
                return d.y1 <= 4 && d.y0 >= 0 && d.x1 > d.x0;
            }

            function labelVisible(d) {
                return d.y1 <= 4 && d.y0 >= 0 && (d.y1 - d.y0) * (d.x1 - d.x0) > 0.03;
            }

            function labelTransform(d) {
                const x = (d.x0 + d.x1) / 2 * 180 / Math.PI;
                const y = (d.y0 + d.y1) / 2;
                return `rotate(${x - 90}) translate(${y},0) rotate(${x < 180 ? 0 : 180})`;
            }

            window.resetSunburstZoom = function() {
                svg.transition().duration(750).call(zoom.transform, d3.zoomIdentity.translate(width / 2, height / 2));
            };
        }

        function showDetail(id) {
            const m = rawMembers.find(item => item && String(item.id).trim() === String(id).trim());
            if (!m) return;

            let spouses = [];
            let rawSpouse = m.spouseIds;
            let spouseList = [];
            if (Array.isArray(rawSpouse)) spouseList = rawSpouse;
            else if (typeof rawSpouse === 'string') {
                let cleaned = rawSpouse.trim();
                if (cleaned.startsWith('[') && cleaned.endsWith(']')) cleaned = cleaned.substring(1, cleaned.length - 1);
                spouseList = cleaned.split(',').map(s => s.trim().replace(/['"]/g, '')).filter(Boolean);
            }

            spouses = spouseList.map(sId => rawMembers.find(item => item && String(item.id).trim() === String(sId).trim())).filter(Boolean);
            let children = rawMembers.filter(item => (String(item.fatherId).trim() === String(id).trim() || String(item.motherId).trim() === String(id).trim()));

            const content = document.getElementById('drawer-content');
            content.innerHTML = `
                <div class="text-center border-b border-stone-200 pb-4">
                    <div class="w-20 h-20 mx-auto rounded-full bg-crimson text-amber-gold flex items-center justify-center text-3xl font-bold mb-2 shadow">
                        <i class="fa-solid fa-users font-bold"></i>
                    </div>
                    <h4 class="text-xl font-bold font-serif-title text-stone-800">${m.name}</h4>
                    ${spouses.length > 0 ? `<p class="text-sm font-semibold text-amber-900 mt-1">Vợ/Chồng: ${spouses.map(s => s.name).join(', ')}</p>` : ''}
                    <span class="inline-block px-3 py-1 bg-amber-100 text-amber-900 font-bold rounded-full text-xs mt-2">Thế hệ Đời thứ F${m.generation || '?'}</span>
                </div>

                <div class="space-y-3 text-sm pt-2">
                    <div class="flex justify-between border-b pb-2">
                        <span class="text-stone-500">Trạng thái:</span>
                        <span class="font-semibold ${m.status === 'Còn sống' ? 'text-green-600' : 'text-red-600'}">${m.status || 'Chưa rõ'}</span>
                    </div>
                    <div class="flex justify-between border-b pb-2">
                        <span class="text-stone-500">${m.status === 'Đã mất' ? 'Ngày giỗ:' : 'Năm sinh:'}</span>
                        <span class="font-semibold">${m.status === 'Đã mất' ? (m.deathDate || 'Chưa rõ') : (m.birthYear || 'Chưa rõ')}</span>
                    </div>
                    <div class="border-b pb-2">
                        <span class="text-stone-500 block mb-1">Con cái (${children.length}):</span>
                        <div class="flex flex-wrap gap-1">
                            ${children.length > 0 ? children.map(c => `<span class="px-2 py-0.5 bg-stone-100 rounded text-xs">${c.name} (Đời F${c.generation})</span>`).join('') : '<span class="text-stone-400">Chưa có dữ liệu</span>'}
                        </div>
                    </div>
                    <div>
                        <span class="text-stone-500 block mb-1">Tiểu sử / Ghi chú:</span>
                        <p class="text-stone-800 bg-stone-50 p-2 rounded text-xs leading-relaxed">${m.notes || 'Không có ghi chú.'}</p>
                    </div>
                </div>

                <div class="pt-4 flex space-x-2">
                    <button onclick="closeDrawer()" class="w-full py-2 bg-crimson text-white font-bold rounded-lg text-sm hover:bg-red-900 transition">Đóng</button>
                </div>
            `;

            document.getElementById('detail-drawer').classList.remove('translate-x-full');
        }
    </script>
</body>
</html>

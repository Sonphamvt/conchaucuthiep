<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biểu Đồ Gia Phả - Dòng Họ Phạm (Từ Đời 7)</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #8b0000;
            margin-bottom: 5px;
        }
        p.subtitle {
            color: #666;
            margin-top: 0;
            margin-bottom: 20px;
        }
        #chart-container {
            position: relative;
            background: white;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border-radius: 12px;
            padding: 20px;
        }
        .node path {
            stroke: #fff;
            stroke-width: 1.5px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .node path:hover {
            opacity: 0.85;
        }
        .node text {
            font-size: 11px;
            fill: #333;
            pointer-events: none;
            text-anchor: middle;
            font-weight: 500;
        }
        .tooltip {
            position: absolute;
            text-align: center;
            padding: 8px 12px;
            font: 12px sans-serif;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            border-radius: 6px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 10;
        }
        .controls {
            margin-bottom: 15px;
        }
        button {
            padding: 8px 16px;
            background-color: #8b0000;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #a00000;
        }
    </style>
</head>
<body>

    <h1>GIA PHẢ DÒNG HỌ PHẠM</h1>
    <p class="subtitle">Biểu đồ Vành Xuyến (Trung tâm: Đời thứ 7 - Vợ chồng cùng hàng)</p>

    <div class="controls">
        <button onclick="resetZoom()">Đặt lại góc nhìn</button>
    </div>

    <div id="chart-container">
        <div id="tooltip" class="tooltip"></div>
    </div>

    <script>
        // Dữ liệu gia phả đã lọc từ Đời 7 làm trung tâm, loại bỏ thông gia, 2 vợ chồng ghép làm 1 nút cùng vành xuyến
        const familyData = {
            name: "Cụ Đời 7 & Bà Cụ",
            title: "Đời 7 (Trung Tâm)",
            generation: 7,
            details: "Khởi điểm phân nhánh chính",
            children: [
                {
                    name: "Phạm Văn A & Nguyễn Thị B",
                    title: "Đời 8 - Chi Trưởng",
                    generation: 8,
                    children: [
                        {
                            name: "Phạm Văn C & Trần Thị D",
                            title: "Đời 9",
                            generation: 9,
                            children: [
                                { name: "Phạm Văn E & Lê Thị F", title: "Đời 10", generation: 10 },
                                { name: "Phạm Thị G & Hoàng Văn H", title: "Đời 10", generation: 10 }
                            ]
                        },
                        {
                            name: "Phạm Văn I & Vũ Thị K",
                            title: "Đời 9",
                            generation: 9,
                            children: [
                                { name: "Phạm Văn L", title: "Đời 10", generation: 10 }
                            ]
                        }
                    ]
                },
                {
                    name: "Phạm Văn M & Đỗ Thị N",
                    title: "Đời 8 - Chi Thứ",
                    generation: 8,
                    children: [
                        {
                            name: "Phạm Văn O & Bùi Thị P",
                            title: "Đời 9",
                            generation: 9,
                            children: [
                                { name: "Phạm Văn Q", title: "Đời 10", generation: 10 },
                                { name: "Phạm Văn R", title: "Đời 10", generation: 10 }
                            ]
                        },
                        {
                            name: "Phạm Thị S & Ngô Văn T",
                            title: "Đời 9",
                            generation: 9
                        }
                    ]
                }
            ]
        };

        const width = 800;
        const height = 800;
        const radius = width / 2;

        // Bảng màu cho các thế hệ (bắt đầu từ Đời 7 trở đi)
        const colorScale = d3.scaleOrdinal()
            .domain([7, 8, 9, 10, 11])
            .range(["#8b0000", "#d9534f", "#f0ad4e", "#5bc0de", "#5cb85c"]);

        const svg = d3.select("#chart-container")
            .append("svg")
            .attr("width", width)
            .attr("height", height)
            .append("g")
            .attr("transform", `translate(${radius},${radius})`);

        const partition = d3.partition()
            .size([2 * Math.PI, radius]);

        const root = d3.hierarchy(familyData)
            .sum(d => d.children ? 0 : 1);

        partition(root);

        const arc = d3.arc()
            .startAngle(d => d.x0)
            .endAngle(d => d.x1)
            .innerRadius(d => d.y0)
            .outerRadius(d => d.y1);

        // Tooltip
        const tooltip = d3.select("#tooltip");

        // Vẽ các phần tử vành xuyến
        const g = svg.selectAll(".node")
            .data(root.descendants())
            .enter().append("g")
            .attr("class", "node");

        g.append("path")
            .attr("d", arc)
            .style("fill", d => colorScale(d.data.generation))
            .on("mouseover", function(event, d) {
                tooltip.style("opacity", 1)
                    .html(`<strong>${d.data.name}</strong><br/>${d.data.title || 'Đời ' + d.data.generation}`)
                    .style("left", (event.pageX - d3.select("#chart-container").node().getBoundingClientRect().left + 10) + "px")
                    .style("top", (event.pageY - d3.select("#chart-container").node().getBoundingClientRect().top - 30) + "px");
            })
            .on("mouseout", function() {
                tooltip.style("opacity", 0);
            });

        // Hiển thị chữ trên các đường cong vành xuyến
        g.append("text")
            .attr("transform", function(d) {
                if (d.depth === 0) return ""; // Tâm biểu đồ không xoay
                const x = (d.x0 + d.x1) / 2 * 180 / Math.PI;
                const y = (d.y0 + d.y1) / 2;
                return `rotate(${x - 90}) translate(${y},0) rotate(${x < 180 ? 0 : 180})`;
            })
            .attr("dy", ".35em")
            .text(d => {
                // Tránh ghi quá dài ở các ô hẹp
                const angle = d.x1 - d.x0;
                if (angle < 0.05 && d.depth !== 0) return "";
                return d.data.name;
            });

        function resetZoom() {
            svg.transition().duration(750).attr("transform", `translate(${radius},${radius})`);
        }
    </script>
</body>
</html>
